name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jvm-tests:
    # The JVM modules need no native pjsua2 build; the APK is built and signed locally for releases.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :sip:test :gateway:test
